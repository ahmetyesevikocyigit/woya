server {
    listen 80;
    listen [::]:80;
    server_name woyatablo.com www.woyatablo.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://woyatablo.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.woyatablo.com;
    ssl_certificate /etc/letsencrypt/live/woyatablo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/woyatablo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://woyatablo.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name woyatablo.com;
    ssl_certificate /etc/letsencrypt/live/woyatablo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/woyatablo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 6m;
    # Preserve old Shopify password-page bookmarks after migration.
    location ~ ^/password/?$ {
        add_header Cache-Control "no-store" always;
        return 302 https://woyatablo.com/;
    }
    location / {
        proxy_pass http://127.0.0.1:3180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
